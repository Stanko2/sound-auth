# my address - changing it will make all connections reset - should be set automatically
address = 'fc88'

# which devices to use for capture and playback 'auto' means the default device
[devices]
playback = 'Built-in Audio Analog Stereo'
capture = 'Built-in Audio Analog Stereo'

# settings for the sound transfer - all of these must be the same on both devices
[Protocol]
# size of FFT window
fftSize = 1024
# frequencies to use for the marker
markerF1 = 15000
markerF2 = 17000

# The minimum strength of this audio device - everything below is clamped to this value
lowestStrength = -100
# Sensitivity of marker detection - lower means more broad, but there could be false positives
strengthThreshold = -60

[Modulation]
# Which technique to use - 'simple', '2tone', 'MFSK'
type = '2tone'
spacing = 5
bitsPerFrame = 4


